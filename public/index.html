<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Screen Share</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: white; text-align: center; padding: 20px; }
        video { width: 80%; max-width: 900px; border: 2px solid #555; border-radius: 8px; margin-top: 20px; background: #000; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border: 0; border-radius: 5px; background: #2271b1; color: white; }
        button:hover { background: #135e96; }
    </style>
</head>
<body>
    <h1>Node.js WebRTC Screen Share</h1>
    <div>
        <button id="hostBtn">Start Hosting My Screen</button>
        <button id="watchBtn">Watch Screen</button>
    </div>
    <br>
    <video id="video" autoplay muted></video>

    <!-- Load Socket.io client from the server -->
    <script src="/socket.io/socket.io.js"></script>
            <script>
        const socket = io();
        const video = document.getElementById('video');
        let peerConnection;
        let isHost = false;
        let isViewer = false;
        
        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // 1. HOST LOGIC
        document.getElementById('hostBtn').addEventListener('click', async () => {
            if (peerConnection) return; // Prevent clicking twice
            isHost = true;
            
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            video.srcObject = stream;

            peerConnection = new RTCPeerConnection(servers);
            stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

            peerConnection.onicecandidate = event => {
                if (event.candidate) socket.emit('ice-candidate', event.candidate);
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer);
            
            document.body.style.background = "#1a4314";
        });

        // WATCH BUTTON LOGIC
        document.getElementById('watchBtn').addEventListener('click', () => {
            if (isViewer) return; // Prevent clicking twice
            isViewer = true;
            
            document.getElementById('hostBtn').style.display = 'none';
            document.getElementById('watchBtn').style.display = 'none';
            
            const h2 = document.createElement('h2');
            h2.id = 'waitingText';
            h2.innerText = "Waiting for host to start sharing...";
            h2.style.color = "#ffeb3b";
            document.querySelector('div').appendChild(h2);
        });

        // 2. VIEWER LOGIC
        socket.on('offer', async (offer) => {
            if (!isViewer || peerConnection) return; // Only process the first offer
            
            peerConnection = new RTCPeerConnection(servers);
            
            peerConnection.ontrack = event => { 
                video.srcObject = event.streams[0]; 
                const h2 = document.getElementById('waitingText');
                if(h2) h2.remove();
            };
            
            peerConnection.onicecandidate = event => {
                if (event.candidate) socket.emit('ice-candidate', event.candidate);
            };

            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        // 3. HOST LOGIC
        socket.on('answer', async (answer) => {
            if (!isHost || !peerConnection || peerConnection.remoteDescription) return; // Only process the first answer
            
            await peerConnection.setRemoteDescription(answer);
        });

        // 4. ICE LOGIC
        socket.on('ice-candidate', async (candidate) => {
            if (peerConnection && peerConnection.remoteDescription) {
                try {
                    await peerConnection.addIceCandidate(candidate);
                } catch (e) { console.log("ICE Error safely ignored:", e); }
            }
        });
    </script>
</body>
</html>
